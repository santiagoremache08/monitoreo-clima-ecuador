name: Actualizar Datos SGR Diariamente

on:
  schedule:
    # Se ejecuta todos los días a las 11:00 UTC (06:00 AM hora de Ecuador)
    - cron: '0 11 * * *' 
  workflow_dispatch: # Agrega un botón en GitHub para ejecutarlo manualmente

jobs:
  extraccion_y_limpieza:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v3
        
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4
        
      - name: ⚙️ Ejecutar pipeline de extracción
        run: python pipeline_sgr.py
        
      - name: 💾 Guardar el nuevo CSV en el repositorio
        run: |
          git config --global user.name "Bot-Actualizador"
          git config --global user.email "bot@tu-proyecto.com"
          git add data/deslaves_sgr.csv
          # El '|| exit 0' evita que el proceso marque error si la SGR no subió desastres nuevos hoy
          git commit -m "Actualización automática: nuevos reportes SGR" || exit 0
          git push
