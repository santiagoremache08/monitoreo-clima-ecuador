name: Actualizar Datos SGR Diariamente

on:
  schedule:
    # Se ejecuta todos los días a las 11:00 UTC (06:00 AM hora de Ecuador)
    - cron: '0 11 * * *' 
  workflow_dispatch: # Agrega un botón en GitHub para ejecutarlo manualmente

jobs:
  extraccion_y_limpieza:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v3
        
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4
        
      - name: ⚙️ Ejecutar pipeline de extracción
        run: python pipeline_sgr.py
        
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download es_core_news_s
