name: Actualizar Datos SGR Diariamente

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  extraccion_y_limpieza:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v3

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m spacy download es_core_news_sm

    - name: ⚙️ Ejecutar pipeline de extracción
      run: python pipeline_sgr.py

    - name: 💾 Guardar el nuevo CSV en el repositorio
      run: |
        git config --global user.name "Bot-Actualizador"
        git config --global user.email "bot@tu-proyecto.com"
        git add data/ || true
        git commit -m "Actualización automática: nuevos reportes" || exit 0
        git push
